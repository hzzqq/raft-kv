name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 600s

      - name: Test with race detector (kvraft + shardmaster)
        run: go test -race ./src/kvraft/ ./src/shardmaster/ -count=1 -timeout 600s

      - name: Test ShardKV with race detector (basic + move + concurrent + readindex)
        # GitHub runners have gcc, so -race runs here. The local managed Go env has
        # no gcc, so shardkv's concurrency is instead guarded by the high-frequency
        # churn-loop tests (TestSKVConcurrent/SnapshotChurn/ReMigration/ConfigProgress).
        # Here we race the single/multi-group migration goroutines (sendShard/fetchShard)
        # AND the concurrent + ReadIndex fast-path workloads to catch data races in the
        # migration state machine and the appliedIndex/ReadIndex read path.
        # (SnapshotChurn at maxraftstate>0 is heavier; kept out to limit CI time.)
        run: go test -race ./src/shardkv/ -run 'TestSKVBasic|TestSKVMove|TestSKVConcurrent|TestSKVReadIndex|TestChaosLeaderKillDuringMigration' -count=1 -timeout 600s

      - name: Test ShardKV SnapshotChurn with race detector (best-effort)
        # SnapshotChurn 走 maxraftstate>0 的快照压缩 + churn 路径，是 installSnapshot /
        # 快照恢复竞态的高价值目标。本地无 gcc 无法跑 -race，故放 CI 侧；标记为
        # continue-on-error：若暴露竞态则上报但不阻断流水线（避免未知竞态卡死 CI）。
        continue-on-error: true
        run: go test -race ./src/shardkv/ -run 'TestSKVSnapshotChurn' -count=1 -timeout 600s

  # 迁移冻结压测：专跑 ReMigration（A→B→A 漂移）+ ThreeGroupChurn（3 组整体再平衡），
  # 高 -count 放大冻结回归概率。冻结属 liveness/deadlock 问题，无需 -race 即可暴露
  # （此前曾在 3-group churn 下确定性挂死）。本地无 gcc，故放 CI 侧、常驻必过。
  migration-stress:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Migration stress (ReMigration + ThreeGroupChurn, -count=5)
        run: go test ./src/shardkv/ -run 'TestSKVReMigration|TestSKVThreeGroupChurn' -count=5 -timeout 900s

  # I17：混沌-竞态专项。把"迁移中杀主"的并发路径（sendShard/fetchShard/migratePump
  # 与 ReadIndex 快读、appliedIndex 并发读）放 -race 下跑，专门捕获迁移状态机与读
  # 路径的数据竞态。本地 managed Go 无 gcc，故放 CI 侧；continue-on-error 不阻断
  # 流水线——暴露竞态即上报。
  chaos-race:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Race detector on chaos + migration paths
        run: go test -race ./src/shardkv/ -run 'TestChaosLeaderKillDuringMigration|TestChaosLongRun|TestSKVReMigration|TestSKVThreeGroupChurn|TestSKVConfigProgress|TestSKVReadIndex|TestSKVLinearizableAppend' -count=1 -timeout 900s

  # I17b：raft 层 -race 专项。配合 cycle 90/20 #3 的 timerMu 修复，专门捕获
  # election/heartbeat Timer 并发改写等 raft 内部数据竞态。GitHub runner 有 gcc，
  # 本地 managed Go 无 gcc 故放 CI 侧；continue-on-error 不阻断流水线——暴露竞态即上报。
  raft-race:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Race detector on raft
        run: go test -race ./src/raft/ -count=1 -timeout 600s

  # I18：混沌长时 job。用 -count 放大"迁移中杀主 + 分片漂移 + 并发读"的 liveness
  # 回归概率（冻结/死锁属 liveness 问题，无需 -race 即可暴露）。常驻必过。
  chaos-long:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Chaos long run (amplified)
        run: go test ./src/shardkv/ -run 'TestChaosLongRun|TestSKVReMigration|TestSKVThreeGroupChurn|TestSKVConfigProgress|TestSKVReadIndex|TestSKVLinearizableAppend' -count=3 -timeout 1200s

  fullstack-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries (gateway / kvcli / demo)
        run: |
          mkdir -p bin
          go build -o bin/gateway ./src/gateway
          go build -o bin/kvcli   ./src/kvcli
          go build -o bin/demo    ./src/demo

      - name: Run demo (cluster -> HTTP gateway -> client full stack)
        run: go run ./src/demo

  # 静态检查：报告但不阻断流水线（continue-on-error）。
  # 对 6.824 起始代码里的历史写法保持宽容；想更严格就调 .golangci.yml。
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

  # 统一门禁（defense-in-depth）：直接跑 check_all.py 编排器本身，
  # 而非逐条脚本——这样编排器的「聚合 / 退出码 / warn_only」逻辑也在 CI 被验证，
  # 避免某条脚本在聚合层被静默吞掉。与 docs-links 互补、纯 Python 免 Go。
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run unified self-check gate (check_all.py)
        run: python3 scripts/check_all.py

  # 文档一致性：纯 Python 静态检查，不依赖 Go 工具链（本机无 go 时也能跑）。
  # 校验仓库内所有 Markdown 的内部相对链接与锚点是否可解析，防止文档漂移。
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Markdown internal links
        run: python3 scripts/check_md_links.py .

      - name: Check gateway endpoints / CLI vs docs consistency
        run: python3 scripts/check_docs_endpoints.py

      - name: Check metric names vs docs consistency
        run: python3 scripts/check_metrics_docs.py

      - name: Check kvcli.Client / util public API vs docs consistency
        run: python3 scripts/check_api_docs.py

      - name: Verify CHANGELOG.md in sync with dev log
        run: python3 scripts/gen_changelog.py --verify

      - name: Check self-driving dev log integrity
        run: python3 scripts/check_state_integrity.py

      - name: Check checker-suite wiring consistency (meta)
        run: python3 scripts/check_doc_inventory.py

      - name: Check coverage.md vs checker inventory (meta)
        run: python3 scripts/check_coverage_doc.py

      - name: Scan for secret/credential leaks (HARD)
        run: python3 scripts/check_secrets.py

      - name: Scan Go anti-patterns (no Go toolchain needed)
        run: python3 scripts/check_go_patterns.py

      - name: Check godoc coverage of exported identifiers
        run: python3 scripts/check_godoc.py

      - name: Detect test-coverage gaps (no Go toolchain needed, soft hints)
        run: python3 scripts/check_test_coverage.py

      - name: Check pre-commit hook installation (soft, informational in CI)
        run: python3 scripts/check_hooks_installed.py || true

      - name: Verify docs/coverage.md module↔test table in sync
        run: python3 scripts/gen_test_coverage.py --verify

      - name: Run checker self-tests (guard the gates themselves)
        run: python3 scripts/tests/test_check_test_coverage.py && python3 scripts/tests/test_check_secrets.py

  # 覆盖率：跑全量测试，生成 cover.out 并上传为 artifact。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test with coverage
        run: go test ./... -count=1 -timeout 900s -coverprofile=cover.out -covermode=atomic

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
